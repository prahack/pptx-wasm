[package]
name = "pptx-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OOXML .pptx parsing, presentation model, and layout to a backend-agnostic display list"

[dependencies]
quick-xml.workspace = true
zip.workspace = true
log.workspace = true

[dev-dependencies]
# Fixtures are byte-for-byte .pptx files built in-memory by the test helpers.
zip.workspace = true

[features]
default = ["charts", "tables"]
# Chart rendering: `parse::chart`, `model::chart` and `layout::chart`. Roughly a tenth of
# the compiled core, and a deck that has no charts pays for all of it. A build without it
# still parses a slide containing a chart and renders everything else on it; the chart
# frame is simply left empty.
charts = []
# Table rendering: the model, the parser and the built-in style tables. The largest
# separable block in the crate — bigger than charts — and most of it is the hardcoded
# PowerPoint style catalogue rather than logic. A build without it renders every other
# shape on a slide that contains a table.
tables = []
